# Sir Prize Linux â neofetch config

# Custom ASCII art for the distro logo
ascii_distro="auto"

# Override with inline ASCII art
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info cols
}

# Use our custom ASCII
ascii_colors=(5 13 6 3 1 2)
bold=on
underline_enabled=on
separator=":"
color_blocks=on
block_width=3
block_height=1
col_offset="auto"

# Image source â comment out to use ASCII
image_backend="ascii"
image_source="
${c5}      _________
${c13}     / ___  ___ \\
${c6}    / / o \\/ o \\ \\
${c3}    \\ \\___/\\___/ /
${c1}     \\-_________/
${c2}      \\  ___  /
${c5}       \\ | | /
${c13}        \\|_|/
${c6}         | |
${c3}        _| |_
${c1}       /     \\
${c2}      / SIR   \\
${c5}     / PRIZE   \\
${c13}    /  LINUX   \\
${c6}   /____________\\
"

